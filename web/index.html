<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexacro RAG Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .app {
            width: 100%;
            max-width: 980px;
            height: 100vh;
            min-height: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #fff;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.06);
        }

        .header {
            padding: 22px 28px;
            border-bottom: 1px solid #e8e8e8;
            background: #fff;
        }

        .header h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 700;
        }

        .header p {
            margin: 6px 0 0;
            color: #777;
            font-size: 13px;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px 24px;
            background: #f7f8fa;
        }

        .welcome {
            max-width: 680px;
            margin: 80px auto 0;
            text-align: center;
            color: #777;
        }

        .welcome-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #333;
            color: #fff;
            font-size: 23px;
            font-weight: bold;
        }

        .welcome h2 {
            margin: 0 0 8px;
            color: #333;
            font-size: 20px;
        }

        .welcome p {
            margin: 0;
            line-height: 1.6;
            font-size: 14px;
        }

        .message {
            display: flex;
            margin-bottom: 22px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .bubble {
            max-width: min(78%, 720px);
            padding: 13px 16px;
            border-radius: 16px;
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user .bubble {
            background: #333;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .assistant .bubble {
            background: #fff;
            color: #222;
            border: 1px solid #e2e3e5;
            border-bottom-left-radius: 4px;
        }

        .assistant .bubble.loading {
            color: #888;
        }

        .input-area {
            padding: 16px 24px 20px;
            border-top: 1px solid #e8e8e8;
            background: #fff;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
            padding: 8px 8px 8px 16px;
            border: 1px solid #ccc;
            border-radius: 14px;
            background: #fff;
        }

        #question {
            flex: 1;
            min-height: 24px;
            max-height: 140px;
            padding: 8px 0;
            border: none;
            outline: none;
            resize: none;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
        }

        #askButton {
            flex: 0 0 42px;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: #fff;
            font-size: 17px;
            cursor: pointer;
        }

        #askButton:hover {
            background: #222;
        }

        #askButton:disabled {
            background: #aaa;
            cursor: default;
        }

        .hint {
            max-width: 900px;
            margin: 7px auto 0;
            color: #999;
            text-align: center;
            font-size: 11px;
        }

        @media (max-width: 700px) {
            .app {
                min-height: 100vh;
                box-shadow: none;
            }

            .header {
                padding: 18px 16px;
            }

            .chat {
                padding: 20px 14px;
            }

            .bubble {
                max-width: 88%;
            }

            .input-area {
                padding: 12px 12px 16px;
            }
        }
    </style>
</head>

<body>
<div class="app">

    <header class="header">
        <h1>Nexacro RAG</h1>
        <p>Nexacro 17 개발 문서 기반 AI 질의응답</p>
    </header>

    <main id="chat" class="chat">
        <div id="welcome" class="welcome">
            <div class="welcome-icon">N</div>
            <h2>Nexacro 17에 대해 무엇이든 질문해보세요.</h2>
            <p>질문을 입력하면 Nexacro 17 문서를 기반으로 답변합니다.</p>
        </div>
    </main>

    <footer class="input-area">
        <div class="input-box">
            <textarea
                id="question"
                rows="1"
                placeholder="Nexacro 17에 대해 질문하세요..."
                aria-label="질문 입력"
            ></textarea>

            <button id="askButton" type="button" onclick="askQuestion()" aria-label="질문 보내기">
                ↑
            </button>
        </div>
        <div class="hint">Enter로 전송 · Shift + Enter로 줄바꿈</div>
    </footer>

</div>

<script>
const API_URL = "http://localhost:5000/api/ask";

const chat = document.getElementById("chat");
const questionInput = document.getElementById("question");
const askButton = document.getElementById("askButton");
const welcome = document.getElementById("welcome");

function addMessage(role, text, loading = false) {
    if (welcome) {
        welcome.remove();
    }

    const message = document.createElement("div");
    message.className = `message ${role}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (loading ? " loading" : "");
    bubble.textContent = text;

    message.appendChild(bubble);
    chat.appendChild(message);
    scrollToBottom();

    return bubble;
}

function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
}

function resizeTextarea() {
    questionInput.style.height = "auto";
    questionInput.style.height = Math.min(questionInput.scrollHeight, 140) + "px";
}

async function askQuestion() {
    const question = questionInput.value.trim();

    if (!question || askButton.disabled) {
        return;
    }

    addMessage("user", question);

    questionInput.value = "";
    resizeTextarea();
    askButton.disabled = true;

    const answerBubble = addMessage(
        "assistant",
        "답변을 생성하고 있습니다...",
        true
    );

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        let data;
        try {
            data = await response.json();
        } catch (e) {
            throw new Error("서버 응답을 읽을 수 없습니다.");
        }

        if (!response.ok) {
            throw new Error(data.error || "API 호출에 실패했습니다.");
        }

        answerBubble.classList.remove("loading");
        answerBubble.textContent = data.answer || "답변이 없습니다.";

    } catch (error) {
        answerBubble.classList.remove("loading");
        answerBubble.textContent = "오류가 발생했습니다.\n\n" + error.message;
        answerBubble.style.color = "#c62828";
    } finally {
        askButton.disabled = false;
        questionInput.focus();
        scrollToBottom();
    }
}

questionInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        askQuestion();
    }
});

questionInput.addEventListener("input", resizeTextarea);
questionInput.focus();
</script>

</body>
</html>
